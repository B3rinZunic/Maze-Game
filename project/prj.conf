CONFIG_LOG=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# MPU6050 (polled - no INT pin wired)
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y

# SSD1306 + character framebuffer
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# cfb_framebuffer_init() allocates the frame buffer from the system heap
# (128 x 64 mono = 1 KiB).
CONFIG_HEAP_MEM_POOL_SIZE=4096

# "%f" in snprintf() and in the log backend
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=2048

# Named threads ("sensor") in logs and the thread analyzer
CONFIG_THREAD_NAME=y

# Persistent high-score table.
# NVS can't be used on this SoC: its settings backend forces the NVS sector
# size to the flash erase-block size (128 KB here) and stores it in a
# uint16_t, so settings_backend_init() returns -EDOM. ZMS uses a uint32_t
# sector size and handles the 128 KB sectors of the storage_partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# Photoresistor at the goal, read on ADC1_IN0 (PA0).
CONFIG_ADC=y