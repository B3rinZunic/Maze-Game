# CHANGED (new file): local copy of Zephyr's pwm-servo binding so the
# `compatible = "pwm-servo"` node in boards/nucleo_f411re.overlay resolves.
# Taken verbatim from zephyr/samples/basic/servo_motor/dts/bindings/pwm-servo.yaml
