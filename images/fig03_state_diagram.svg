<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; rx: 10; }
      .menu { fill: #dbeafe; stroke: #2563eb; }
      .game { fill: #dcfce7; stroke: #16a34a; }
      .save { fill: #fef3c7; stroke: #d97706; }
      .name { font-weight: 600; text-anchor: middle; fill: #111827; }
      .sub  { text-anchor: middle; fill: #4b5563; font-size: 11px; }
      .edge { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .lbl  { fill: #111827; font-size: 12px; }
      .mid  { text-anchor: middle; }
      .end  { text-anchor: end; }
    </style>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <!-- start marker -->
  <circle cx="450" cy="28" r="7" fill="#111827"/>
  <path class="edge" d="M450,35 L450,72"/>
  <text class="lbl" x="462" y="56">boot</text>

  <!-- states -->
  <rect class="box menu" x="375" y="74" width="150" height="52"/>
  <text class="name" x="450" y="97">HOME</text><text class="sub" x="450" y="114">main menu</text>

  <rect class="box menu" x="35" y="74" width="150" height="52"/>
  <text class="name" x="110" y="97">SCORES</text><text class="sub" x="110" y="114">top-5 list</text>

  <rect class="box menu" x="715" y="74" width="150" height="52"/>
  <text class="name" x="790" y="97">SETTINGS</text><text class="sub" x="790" y="114">sensitivity / reset</text>

  <rect class="box menu" x="715" y="244" width="150" height="52"/>
  <text class="name" x="790" y="267">CONFIRM</text><text class="sub" x="790" y="284">reset scores?</text>

  <rect class="box game" x="375" y="244" width="150" height="52"/>
  <text class="name" x="450" y="267">PLAYING</text><text class="sub" x="450" y="284">timer + servos on</text>

  <rect class="box save" x="375" y="404" width="150" height="52"/>
  <text class="name" x="450" y="427">ASK_SAVE</text><text class="sub" x="450" y="444">"TOP SCORE!"</text>

  <rect class="box save" x="715" y="404" width="150" height="52"/>
  <text class="name" x="790" y="427">NAME_ENTRY</text><text class="sub" x="790" y="444">3 letters</text>

  <rect class="box game" x="35" y="244" width="150" height="52"/>
  <text class="name" x="110" y="267">RESULT</text><text class="sub" x="110" y="284">time + rank</text>

  <!-- HOME <-> SCORES -->
  <path class="edge" d="M375,90 L185,90"/>
  <text class="lbl mid" x="280" y="82">OK: Results</text>
  <path class="edge" d="M185,110 L375,110"/>
  <text class="lbl mid" x="280" y="126">OK: &lt; Back</text>

  <!-- HOME <-> SETTINGS -->
  <path class="edge" d="M525,90 L715,90"/>
  <text class="lbl mid" x="620" y="82">OK: Settings</text>
  <path class="edge" d="M715,110 L525,110"/>
  <text class="lbl mid" x="620" y="126">OK: Back</text>

  <!-- SETTINGS <-> CONFIRM -->
  <path class="edge" d="M760,126 L760,244"/>
  <text class="lbl end" x="752" y="180">OK: Reset</text>
  <text class="lbl end" x="752" y="196">scores</text>
  <path class="edge" d="M820,244 L820,126"/>
  <text class="lbl" x="828" y="172">OK = yes (wipe)</text>
  <text class="lbl" x="828" y="188">PREV/NEXT = no</text>

  <!-- HOME -> PLAYING and abort -->
  <path class="edge" d="M490,126 L490,244"/>
  <text class="lbl" x="498" y="180">OK: Start Game</text>
  <text class="lbl" x="498" y="196">(arm goal, servos on)</text>
  <path class="edge" d="M425,244 L425,126"/>
  <text class="lbl end" x="417" y="172">long-press OK</text>
  <text class="lbl end" x="417" y="188">(abort run)</text>

  <!-- PLAYING -> RESULT / ASK_SAVE -->
  <path class="edge" d="M375,270 L185,270"/>
  <text class="lbl mid" x="280" y="262">goal, not top 5</text>
  <path class="edge" d="M450,296 L450,404"/>
  <text class="lbl" x="458" y="345">goal reached,</text>
  <text class="lbl" x="458" y="361">time in top 5</text>

  <!-- ASK_SAVE -> NAME_ENTRY / RESULT -->
  <path class="edge" d="M525,430 L715,430"/>
  <text class="lbl mid" x="620" y="422">OK (save?)</text>
  <path class="edge" d="M375,420 L150,296"/>
  <text class="lbl end" x="262" y="378">PREV/NEXT (skip)</text>

  <!-- NAME_ENTRY -> RESULT -->
  <path class="edge" d="M790,456 L790,520 L110,520 L110,296"/>
  <text class="lbl mid" x="450" y="512">OK on 3rd letter (save to flash)</text>

  <!-- RESULT -> HOME -->
  <path class="edge" d="M160,244 L385,126"/>
  <text class="lbl mid" x="250" y="178">any button</text>

  <!-- legend -->
  <rect x="35" y="14" width="14" height="14" fill="#dbeafe" stroke="#2563eb"/>
  <text class="lbl" x="55" y="26">menu screen</text>
  <rect x="140" y="14" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/>
  <text class="lbl" x="160" y="26">run / result</text>
  <rect x="245" y="14" width="14" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text class="lbl" x="265" y="26">score saving</text>
</svg>
